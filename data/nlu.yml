- regex: time
  examples: |
   - (1[0-2]|0?[1-9]):[0-5][0-9] ?[AaPp][Mm]      # 10:30 AM, 9:15 pm
   - (1[0-2]|0?[1-9]) ?[AaPp][Mm]                 # 9am, 10 pm
   - ([01]?[0-9]|2[0-3]):[0-5][0-9]               # 09:00, 18:30 (24-hr)
   - ([01]?[0-9]|2[0-3]) ?(hours|hrs|h)?          # 9 hours, 18h
   - (morning|afternoon|evening|night|noon|midnight)
   - (after lunch|before lunch|after work|before dinner)
   - (in the )?(next|coming) (hour|few hours|couple of hours)
   - in ([0-9]+) (minutes?|hours?)


